<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Skin Analyzer</title>
  <style>
    /* Basic styling for layout */
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    #preview { display: none; margin-top: 1rem; max-width: 300px; }
    #result { margin-top: 1rem; font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h1>Upload a selfie for skin analysis</h1>

  <!-- Input field to select or take a photo -->
  <input type="file" id="imageInput" accept="image/*" capture="environment"><br>

 <!-- Preview image area -->
  <img id="preview" src="#" alt="Preview" />

  <!-- Button to trigger the analysis -->
  <button id="analyzeBtn">Analyze</button>

 <!-- Div where results will be shown -->
  <div id="result"></div>

  <script>
    // Get HTML elements
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const resultBox = document.getElementById('result');
    const analyzeBtn = document.getElementById('analyzeBtn');

    // When user selects an image, show a preview
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0]; // Get selected file
      if (!file) return;

      const reader = new FileReader(); // Create file reader
      reader.onload = (e) => {
        preview.src = e.target.result; // Set preview source
        preview.style.display = 'block'; // Show preview
      };
      reader.readAsDataURL(file); // Read file as base64 for preview
    });

    // When "Analyze" button is clicked
    analyzeBtn.addEventListener('click', async () => {
      const file = imageInput.files[0]; // Get uploaded image file
      if (!file) {
        alert('Please select an image.'); // Warn if no image
        return;
      }

      // Prepare form data to send to backend
      const formData = new FormData();
      formData.append('image', file);

      // Show loading message
      resultBox.textContent = 'Analyzing...';

      try {
        // Send image to backend API (/api/analyze)
        const res = await fetch('/api/analyze', {
          method: 'POST',
          body: formData
        });

        const data = await res.json(); // Parse JSON response

        // ✅ If API returns valid results
        if (data.error_code === 0 && data.result) {
          const result = data.result;

// Insert text results into page
resultBox.innerHTML = `
  <p>✅ Analysis Complete:</p>
  <ul>
    <li><strong>Skin Age:</strong> ${result.skin_age?.value}</li>
    <li><strong>Acne Count:</strong> ${result.acne?.count}</li>
    <li><strong>Blackhead Count:</strong> ${result.blackhead_count}</li>
    <li><strong>Wrinkle Score (Right Eye):</strong> ${result.right_eye_wrinkle_info?.wrinkle_score}</li>
    <li><strong>Skin Type:</strong> ${result.skin_type?.skin_type}</li>
    <li><strong>Total Score:</strong> ${result.score_info?.total_score}</li>

    <!-- ✅ Extra values from AILab -->
    <li><strong>Eye Pouch:</strong> ${result.eye_pouch?.value}</li>
    <li><strong>Dark Circle Severity:</strong> ${result.dark_circle_severity?.value}</li>
    <li><strong>Forehead Wrinkle Score:</strong> ${result.forehead_wrinkle_info?.wrinkle_score}</li>
    <li><strong>Crow’s Feet Score:</strong> ${result.right_crowsfeet_wrinkle_info?.wrinkle_score}</li>
    <li><strong>Brown Spot Count:</strong> ${result.brown_spot?.count}</li>
    <li><strong>Closed Comedones Count:</strong> ${result.closed_comedones?.count}</li>
    <li><strong>Water Severity:</strong> ${result.water?.water_severity}</li>
    <li><strong>Roughness Severity:</strong> ${result.rough?.rough_severity}</li>
    <li><strong>Sensitivity Type:</strong> ${result.sensitivity_type_v1}</li>
  </ul>
`;

// ✅ Try to display maps if AILab returns any base64 images
const faceMaps = result.face_maps || {};
const maps = {
  brown_area: "Brown Area Map",
  red_area: "Red Area Map",
  texture_enhanced_pores_map: "Pore Map",
  texture_enhanced_blackheads_map: "Blackhead Map",
  texture_enhanced_lines_map: "Wrinkle Map",
  water_area_map: "Water Map",
  rough_area_map: "Roughness Map",
  roi_outline_map: "Region of Interest Map"
};

for (const key in maps) {
  // check face_maps first, then fallback to root-level (for older formats)
  const base64 = faceMaps[key] || result[key];
  if (base64) {
    const label = `<p><strong>${maps[key]}</strong></p>`;
    const image = `<img src="data:image/jpeg;base64,${base64}" alt="${maps[key]}" style="max-width:100%; margin-bottom: 20px;" />`;
    resultBox.innerHTML += label + image;
  }
}


         
        } else {
          // ❌ Error message if no result
          resultBox.textContent = '❌ Error: ' + (data.message || data.error_msg || 'Unknown response');
        }
      } catch (err) {
        // ❌ Error if server is down or fetch fails
        resultBox.textContent = '❌ Error connecting to server.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
