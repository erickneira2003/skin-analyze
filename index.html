<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Skin Analyzer</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 2rem; }
    #preview { display: none; margin-top: 1rem; max-width: 300px; }
    #result { margin-top: 1rem; font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h1>Upload a selfie for skin analysis</h1>

  <!-- Image input -->
  <input type="file" id="imageInput" accept="image/*" capture="environment"><br>

  <!-- Preview -->
  <img id="preview" src="#" alt="Preview" />

  <!-- Button -->
  <button id="analyzeBtn">Analyze</button>

  <!-- Result display -->
  <div id="result"></div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const resultBox = document.getElementById('result');
    const analyzeBtn = document.getElementById('analyzeBtn');

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    analyzeBtn.addEventListener('click', async () => {
      const file = imageInput.files[0];
      if (!file) {
        alert('Please select an image.');
        return;
      }

      const formData = new FormData();
      formData.append('image', file);

      resultBox.textContent = 'Analyzing...';

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.error_code === 0 && data.result) {
          const result = data.result;

          resultBox.innerHTML = `
            <p>✅ Analysis Complete:</p>
            <ul>
              <li><strong>Skin Age:</strong> ${result.skin_age?.value}</li>
              <li><strong>Acne Count:</strong> ${result.acne?.count}</li>
              <li><strong>Blackhead Count:</strong> ${result.blackhead_count}</li>
              <li><strong>Wrinkle Score (Right Eye):</strong> ${result.right_eye_wrinkle_info?.wrinkle_score}</li>
              <li><strong>Skin Type:</strong> ${result.skin_type?.skin_type}</li>
              <li><strong>Total Score:</strong> ${result.score_info?.total_score}</li>
               <li><strong>Oil Intensity (T-zone):</strong> ${result.oily_intensity?.t_zone?.oily_score}</li>
              <li><strong>Water Severity:</strong> ${result.water?.water_severity}</li>
              <li><strong>Roughness Severity:</strong> ${result.rough?.rough_severity}</li>
              <li><strong>Eye Pouch:</strong> ${result.eye_pouch?.value}</li>
              <li><strong>Dark Circle Severity:</strong> ${result.dark_circle_severity?.value}</li>
              <li><strong>Forehead Wrinkle Score:</strong> ${result.forehead_wrinkle_info?.wrinkle_score}</li>
              <li><strong>Glabella Wrinkle Score:</strong> ${result.glabella_wrinkle_info?.wrinkle_score}</li>
              <li><strong>Crow’s Feet Score (Right):</strong> ${result.right_crowsfeet_wrinkle_info?.wrinkle_score}</li>
              <li><strong>Enlarged Pores (Forehead):</strong> ${result.enlarged_pore_count?.forehead_count}</li>
              <li><strong>Brown Spot Count:</strong> ${result.brown_spot?.count}</li>
              <li><strong>Closed Comedones Count:</strong> ${result.closed_comedones?.count}</li>
              <li><strong>Skin Tone (ITA):</strong> ${result.skintone_ita?.ITA}</li>
              <li><strong>Skin Hue (HA):</strong> ${result.skin_hue_ha?.HA}</li>
              <li><strong>Sensitivity Type:</strong> ${result.sensitivity_type_v1}</li>
              <li><strong>Melanin Score:</strong> ${result.score_info?.melanin_score}</li>
              <li><strong>Pores Score:</strong> ${result.score_info?.pores_score}</li>
              <li><strong>Wrinkle Score:</strong> ${result.score_info?.wrinkle_score}</li>
              <li><strong>Blackhead Score:</strong> ${result.score_info?.blackhead_score}</li>
              <li><strong>Acne Score:</strong> ${result.score_info?.acne_score}</li>
              <li><strong>Roughness Score:</strong> ${result.score_info?.rough_score}</li>
              <li><strong>Hydration Score:</strong> ${result.score_info?.water_score}</li>
              <li><strong>Sensitivity Score:</strong> ${result.score_info?.sensitivity_score}</li>
  </ul>
`;
         
        } else {
          resultBox.textContent = '❌ Error: ' + (data.message || data.error_msg || 'Unknown response');
        }
      } catch (err) {
        resultBox.textContent = '❌ Error connecting to server.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
